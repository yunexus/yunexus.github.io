services:
  jekyll-site:
    image: jekyll-site
    build: .
    volumes: [ .:/usr/src/app ]
    # 4000 serves the site; 35729 is the browser auto-refresh channel.
    ports: [ 4000:4000, 35729:35729 ]
    user: 1000:1000
    environment: [ JEKYLL_ENV=docker ]
    # Polling makes change detection reliable for Windows bind mounts.
    command: jekyll serve -H 0.0.0.0 -w --force_polling --livereload --config _config.yml,_config_docker.yml
